<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Moodbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-source="web">
  <main class="moodbar">
    <div class="brand">
      <img class="brand-logo" src="assets/logo-dit.png" alt="Logo Dakar Institute of Technology" onerror="this.style.display='none'">
      <div class="brand-text">
        <p class="brand-name">M🙂🙁dBar</p>
        <p class="brand-school">Dakar Institute of Technology</p>
      </div>
    </div>

    <h1>Comment te sens-tu aujourd'hui ?</h1>

    <div class="buttons">
      <button class="mood-btn" data-mood="content" aria-label="Content">🙂</button>
      <button class="mood-btn" data-mood="neutre" aria-label="Neutre">😐</button>
      <button class="mood-btn" data-mood="pas_content" aria-label="Pas content">🙁</button>
    </div>

    <p id="feedback" class="feedback" aria-live="polite"></p>

    <a id="admin-link" class="admin-link" href="#" target="_blank" rel="noopener">📊 Tableau de bord administrateur</a>
  </main>

  <script src="script.js"></script>
</body>
</html>
